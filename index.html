<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0507">
<title>papochkadeneg</title>
<meta name="description" content="я драчун">
<meta property="og:title" content="papochkadeneg">
<meta property="og:description" content="я драчун">
<meta property="og:image" content="poster.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=Manrope:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{--blood:#e11d2e;--bone:#f3ece8;--ink:#0a0507;--twitch:#9146ff;
    --display:"Unbounded","Arial Black",system-ui,sans-serif;
    --text:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif}
  *{box-sizing:border-box;margin:0}
  html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
  body{background:var(--ink);color:var(--bone);font-family:var(--text);min-height:100vh;min-height:100dvh;overflow-x:hidden}

  .bg{position:fixed;inset:0;z-index:0;background:var(--ink) url(poster.jpg) center/cover}
  .bg video{width:100%;height:100%;object-fit:cover;object-position:50% 40%;pointer-events:none}
  .bg::after{content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,rgba(10,5,7,.88) 0%,rgba(10,5,7,.5) 50%,rgba(10,5,7,.1) 100%),
               linear-gradient(0deg,rgba(10,5,7,.7) 0%,transparent 45%)}

  .page{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:28px;
    padding:max(32px,env(safe-area-inset-top)) max(clamp(24px,8vw,120px),env(safe-area-inset-right)) max(36px,env(safe-area-inset-bottom)) max(clamp(24px,8vw,120px),env(safe-area-inset-left))}

  h1{font-family:var(--display);font-weight:800;line-height:.96;letter-spacing:-.02em;
    font-size:clamp(2.2rem,11.5vw,7rem);color:transparent;-webkit-text-stroke:1.6px var(--bone);
    filter:drop-shadow(0 0 22px rgba(225,29,46,.4));animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
  h1 span{display:block}

  .bg::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;box-shadow:inset 0 0 180px rgba(225,29,46,0);transition:box-shadow 1.2s}
  .ingame .bg::before{box-shadow:inset 0 0 180px rgba(225,29,46,.45)}

  .dc{display:flex;align-items:center;gap:12px;align-self:flex-start;max-width:100%;min-height:56px;padding:10px 18px;border-radius:18px;
    background:rgba(14,6,9,.55);color:var(--bone);border:1px solid rgba(255,255,255,.16);font:600 .95rem var(--text);text-align:left;cursor:pointer;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);touch-action:manipulation;transition:transform .2s,background .2s}
  .dc[hidden]{display:none}
  .dc:active{transform:scale(.98)}
  .dc:focus-visible{outline:3px solid #fff;outline-offset:3px}
  .dot{width:12px;height:12px;border-radius:50%;background:#747f8d;flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.08)}
  .dot.online{background:#23a55a}.dot.idle{background:#f0b232}.dot.dnd{background:#f23f43}
  .dc-body{display:flex;flex-direction:column;gap:2px;min-width:0}
  .dc-top b{font-weight:800;opacity:.6;margin-right:6px}
  .dc-act{font-size:.85rem;opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dc img{border-radius:8px;flex:none;object-fit:cover;margin-left:auto}
  @media (hover:hover){.dc:hover{background:rgba(40,16,22,.7)}}

  .hours{font-weight:600;font-size:1.05rem;opacity:.8;overflow-wrap:anywhere}

  .links{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:56px;padding:0 26px;border-radius:999px;
    color:#fff;text-decoration:none;font-weight:800;font-size:1.05rem;white-space:nowrap;position:relative;overflow:hidden;
    transition:transform .2s,box-shadow .2s,background .2s}
  .btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
  .btn:active{transform:scale(.97)}
  .btn svg{flex:none}

  .main{background:var(--blood);padding:0 32px;min-height:62px;font-size:1.15rem;box-shadow:0 10px 34px rgba(225,29,46,.45),0 0 0 1px rgba(255,255,255,.14) inset}
  .main::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;transform:skewX(-20deg);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:shine 4.5s ease-in-out infinite}
  .twitch{background:var(--twitch);box-shadow:0 10px 30px rgba(145,70,255,.35)}
  .twink{background:rgba(14,6,9,.55);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-weight:600}

  @media (hover:hover){
    .main:hover{transform:translateY(-2px);box-shadow:0 14px 44px rgba(225,29,46,.65),0 0 0 1px rgba(255,255,255,.2) inset}
    .twitch:hover{transform:translateY(-2px);box-shadow:0 14px 38px rgba(145,70,255,.55)}
    .twink:hover{transform:translateY(-2px);background:rgba(40,16,22,.7)}
  }

  .sound{position:fixed;z-index:3;right:max(16px,env(safe-area-inset-right));top:max(16px,env(safe-area-inset-top));
    min-height:44px;padding:0 18px;border-radius:999px;background:rgba(14,6,9,.55);color:var(--bone);border:1px solid rgba(255,255,255,.16);
    font:600 .85rem var(--text);cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .sound:focus-visible{outline:3px solid rgba(255,255,255,.7);outline-offset:2px}

  @property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
  .gate{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding:24px;text-align:center;overflow:hidden;
    background:radial-gradient(ellipse at 50% 55%,rgba(10,5,7,.5),rgba(10,5,7,.94));
    backdrop-filter:blur(10px) saturate(.8);-webkit-backdrop-filter:blur(10px) saturate(.8);
    transition:opacity .9s ease,transform .9s ease,backdrop-filter .9s,-webkit-backdrop-filter .9s}
  .gate.out{opacity:0;transform:scale(1.06);pointer-events:none;backdrop-filter:blur(0);-webkit-backdrop-filter:blur(0)}
  .gate[hidden]{display:none}
  .fog{position:absolute;inset:0;pointer-events:none;filter:blur(46px)}
  .fog i{position:absolute;border-radius:50%;background:rgba(200,180,185,.22)}
  .fog i:nth-child(1){width:70vmax;height:34vmax;left:-25%;top:8%;animation:drift 22s ease-in-out infinite alternate}
  .fog i:nth-child(2){width:60vmax;height:30vmax;right:-30%;bottom:6%;animation:drift 28s ease-in-out infinite alternate-reverse}
  .fog i:nth-child(3){width:50vmax;height:24vmax;left:20%;top:40%;background:rgba(225,29,46,.16);animation:drift 18s ease-in-out infinite alternate}
  @keyframes drift{to{transform:translate(18vw,-4vh) scale(1.15)}}
  .g-nick{position:relative;font-family:var(--display);font-weight:800;font-size:clamp(1.3rem,7vw,2.8rem);letter-spacing:-.02em;max-width:100%;
    color:transparent;-webkit-text-stroke:1.2px var(--bone);filter:drop-shadow(0 0 16px rgba(225,29,46,.45))}
  .go{position:relative;z-index:1;font:800 1.05rem var(--text);letter-spacing:.06em;color:var(--bone);background:rgba(14,6,9,.62);
    border:0;border-radius:999px;padding:21px 54px;cursor:pointer;overflow:hidden;touch-action:manipulation;
    box-shadow:0 0 0 1px rgba(255,255,255,.1),0 0 44px rgba(225,29,46,.28),inset 0 0 22px rgba(225,29,46,.2);
    transition:box-shadow .3s,transform .3s}
  .go::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.6px;
    background:conic-gradient(from var(--a),transparent 0 52%,var(--blood) 80%,#ff8a78 92%,transparent 100%);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask-composite:exclude;animation:spin 3s linear infinite}
  .go::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--blood),transparent 75%);opacity:0;transition:opacity .35s}
  .go span{position:relative;z-index:1}
  .go:focus-visible{transform:scale(1.045);outline:none;box-shadow:0 0 0 1px rgba(255,255,255,.18),0 0 70px rgba(225,29,46,.6),inset 0 0 28px rgba(225,29,46,.45)}
  .go:focus-visible::after{opacity:.5}
  @media (hover:hover){
    .go:hover{transform:scale(1.045);box-shadow:0 0 0 1px rgba(255,255,255,.18),0 0 70px rgba(225,29,46,.6),inset 0 0 28px rgba(225,29,46,.45)}
    .go:hover::after{opacity:.5}
  }
  .go:active{transform:scale(.98)}
  @keyframes spin{to{--a:360deg}}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  @keyframes shine{0%,60%{left:-60%}100%{left:130%}}

  @media (max-width:720px){
    .bg::after{background:linear-gradient(0deg,rgba(10,5,7,.92) 0%,rgba(10,5,7,.55) 50%,rgba(10,5,7,.3) 100%)}
    .page{justify-content:flex-end;gap:22px;padding-bottom:max(40px,calc(env(safe-area-inset-bottom) + 28px))}
    .dc{align-self:stretch}
    .links{flex-direction:column;align-items:stretch}
    .btn{width:100%}
    .main{order:-1}
  }
  @media (max-height:520px) and (orientation:landscape){
    .page{justify-content:center;gap:14px}
    h1{font-size:clamp(2rem,9vh,4rem)}
    .links{flex-direction:row}
    .btn{width:auto;min-height:48px}
  }
  @media (prefers-reduced-motion:reduce){h1,.go::before,.fog i,.main::after{animation:none}.btn{transition:none}}
</style>
</head>
<body>

<div class="bg"><video id="v" autoplay muted loop playsinline webkit-playsinline preload="auto" poster="poster.jpg" disablepictureinpicture disableremoteplayback x-webkit-airplay="deny"><source src="bg.mp4" type="video/mp4"></video></div>

<button class="sound" id="sound" type="button" hidden></button>

<main class="page">
  <h1 aria-label="papochkadeneg"><span>papochka</span><span>deneg</span></h1>
  <p class="hours">хаххавхахвхахва</p>
  <button class="dc" id="dc" type="button" hidden>
    <span class="dot" id="dot"></span>
    <span class="dc-body">
      <span class="dc-top"><b>Discord</b><span id="dcname"></span></span>
      <span class="dc-act" id="dcact" hidden></span>
    </span>
    <img id="dcart" alt="" width="40" height="40" hidden>
  </button>
  <nav class="links">
    <a class="btn main" href="https://steamcommunity.com/id/wvwwwvwvww/" target="_blank" rel="noopener">
      <span data-t="main">Мой Steam</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>
    </a>
    <a class="btn twitch" href="https://www.twitch.tv/thepadlo" target="_blank" rel="noopener">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 2 2.5 6v14H8v3h3l3-3h4l5-5V2H4Zm16 12-3 3h-5l-3 3v-3H6V4h14v10Zm-3-7h-2v5h2V7Zm-5 0h-2v5h2V7Z"/></svg>
      <span>Twitch</span>
    </a>
    <a class="btn twink" href="https://steamcommunity.com/id/papochkadeneg" target="_blank" rel="noopener">
      <span data-t="twink">Твинк Steam</span>
    </a>
  </nav>
</main>

<div class="gate" id="gate">
  <div class="fog" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="g-nick">papochkadeneg</div>
  <button class="go" id="enter" type="button"><span data-t="go">Продолжить</span></button>
</div>

<script>
  // Язык: русский для ru/uk/be, иначе английский
  const L=(navigator.languages&&navigator.languages[0]||navigator.language||"en").toLowerCase();
  const ru=/^(ru|uk|be)/.test(L);
  const T=ru
    ?{main:"Мой Steam",twink:"Твинк Steam",go:"Продолжить",on:"Звук включён",off:"Включить звук",copied:"скопировано",play:"Играет",listen:"Слушает",now:"только что",desc:"я драчун"}
    :{main:"My Steam",twink:"Smurf Steam",go:"Continue",on:"Sound on",off:"Turn sound on",copied:"copied",play:"Playing",listen:"Listening",now:"just started",desc:"i'm a brawler"};
  document.documentElement.lang=ru?"ru":"en";
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=T[e.dataset.t]);
  document.querySelector('meta[name=description]').content=T.desc;
  document.querySelector('meta[property="og:description"]').content=T.desc;

  const v=document.getElementById("v"),gate=document.getElementById("gate"),btn=document.getElementById("sound");
  const sync=()=>btn.textContent=v.muted?T.off:T.on;
  const play=()=>{const p=v.play();if(p&&p.catch)p.catch(()=>{})};
  play();

  // Вход: play() вызывается сразу в жесте пользователя, без перемотки (на iOS она ломала воспроизведение)
  document.getElementById("enter").addEventListener("click",()=>{
    v.muted=false;v.volume=1;play();
    gate.classList.add("out");btn.hidden=false;sync();
    setTimeout(()=>gate.hidden=true,950);
  });
  btn.addEventListener("click",()=>{v.muted=!v.muted;play();sync()});

  // Автовозобновление: iOS ставит видео на паузу при шторке, уведомлениях и сворачивании
  v.addEventListener("pause",()=>{if(!document.hidden&&!v.ended)setTimeout(play,60)});
  v.addEventListener("ended",()=>{v.currentTime=0;play()});
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)play()});
  addEventListener("pageshow",play);
  addEventListener("focus",play);
  document.addEventListener("touchstart",()=>{if(v.paused)play()},{passive:true});
  if("mediaSession" in navigator){
    navigator.mediaSession.setActionHandler("play",play);
    navigator.mediaSession.setActionHandler("pause",play);
  }

  // Discord: ник по тапу + активность через Lanyard (нужно быть на сервере Lanyard)
  const ID="786996255884050493";
  const dc=document.getElementById("dc"),dot=document.getElementById("dot"),dcname=document.getElementById("dcname"),
        dcact=document.getElementById("dcact"),dcart=document.getElementById("dcart");
  let data=null,nick="",flash;
  const fmt=ms=>{const m=Math.floor(ms/6e4);if(m<1)return T.now;const h=Math.floor(m/60);
    return h?(ru?h+"ч "+m%60+"м":h+"h "+m%60+"m"):(ru?m+"м":m+"m")};
  function render(){
    if(!data)return;
    nick=data.discord_user.username;
    if(!flash)dcname.textContent=nick;
    dot.className="dot "+(data.discord_status||"offline");
    const game=(data.activities||[]).find(a=>a.type===0);
    let line="",art="";
    if(game){
      line=T.play+" · "+game.name+(game.timestamps&&game.timestamps.start?" · "+fmt(Date.now()-game.timestamps.start):"");
    }else if(data.listening_to_spotify&&data.spotify){
      line=T.listen+" · "+data.spotify.song+" — "+data.spotify.artist;art=data.spotify.album_art_url||"";
    }
    dcact.textContent=line;dcact.hidden=!line;
    if(art){if(dcart.src!==art)dcart.src=art}
    dcart.hidden=!art;
    document.body.classList.toggle("ingame",!!game);
    dc.hidden=false;
  }
  async function load(){
    if(document.hidden)return;
    try{
      const r=await fetch("https://api.lanyard.rest/v1/users/"+ID,{cache:"no-store"});
      const j=await r.json();
      if(j.success){data=j.data;render()}
    }catch(e){}
  }
  async function copy(t){
    try{await navigator.clipboard.writeText(t)}
    catch(e){const a=document.createElement("textarea");a.value=t;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.select();
      try{document.execCommand("copy")}catch(_){}a.remove()}
  }
  dc.addEventListener("click",()=>{
    if(!nick)return;
    copy(nick);dcname.textContent=T.copied;clearTimeout(flash);
    flash=setTimeout(()=>{flash=0;dcname.textContent=nick},1500);
  });
  load();setInterval(load,20000);setInterval(render,30000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
</script>
</body>
</html>
