<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0507">
<title>papochkadeneg</title>
<meta name="description" content="я драчун">
<meta property="og:title" content="papochkadeneg">
<meta property="og:description" content="я драчун">
<meta property="og:image" content="poster.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=Manrope:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{--blood:#e11d2e;--bone:#f3ece8;--ink:#0a0507;
    --display:"Unbounded","Arial Black",system-ui,sans-serif;
    --text:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif}
  *{box-sizing:border-box;margin:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--ink);color:var(--bone);font-family:var(--text);min-height:100vh;min-height:100dvh;overflow-x:hidden}

  .bg{position:fixed;inset:0;z-index:0}
  .bg video{width:100%;height:100%;object-fit:cover;object-position:50% 40%}
  .bg::after{content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,rgba(10,5,7,.88) 0%,rgba(10,5,7,.5) 50%,rgba(10,5,7,.1) 100%),
               linear-gradient(0deg,rgba(10,5,7,.7) 0%,transparent 45%)}

  .page{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:28px;
    padding:max(32px,env(safe-area-inset-top)) clamp(24px,8vw,120px) max(36px,env(safe-area-inset-bottom))}

  h1{font-family:var(--display);font-weight:800;line-height:.96;letter-spacing:-.02em;
    font-size:clamp(2.8rem,14.5vw,7rem);color:transparent;-webkit-text-stroke:1.6px var(--bone);
    filter:drop-shadow(0 0 22px rgba(225,29,46,.4));animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
  h1 span{display:block}
  h1 span+span{padding-left:.6em}

  .hours{font-weight:600;font-size:1.05rem;opacity:.8}

  .steam{align-self:flex-start;display:inline-flex;align-items:center;gap:12px;padding:17px 26px;border-radius:999px;
    background:var(--blood);color:#fff;text-decoration:none;font-weight:800;font-size:1.05rem;
    box-shadow:0 10px 34px rgba(225,29,46,.38);transition:transform .2s,box-shadow .2s}
  .steam:hover{transform:translateY(-2px);box-shadow:0 14px 40px rgba(225,29,46,.55)}
  .steam:focus-visible{outline:3px solid #fff;outline-offset:3px}


  .sound{position:fixed;z-index:3;right:max(16px,env(safe-area-inset-right));top:max(16px,env(safe-area-inset-top));
    padding:11px 16px;border-radius:999px;background:rgba(14,6,9,.55);color:var(--bone);border:1px solid rgba(255,255,255,.16);
    font:600 .85rem var(--text);cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .sound:focus-visible{outline:3px solid rgba(255,255,255,.7);outline-offset:2px}

  @property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
  .gate{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding:24px;text-align:center;overflow:hidden;
    background:radial-gradient(ellipse at 50% 55%,rgba(10,5,7,.5),rgba(10,5,7,.94));
    backdrop-filter:blur(10px) saturate(.8);-webkit-backdrop-filter:blur(10px) saturate(.8);
    transition:opacity .9s ease,transform .9s ease,backdrop-filter .9s,-webkit-backdrop-filter .9s}
  .gate.out{opacity:0;transform:scale(1.06);pointer-events:none;backdrop-filter:blur(0);-webkit-backdrop-filter:blur(0)}
  .gate[hidden]{display:none}
  .fog{position:absolute;inset:0;pointer-events:none;filter:blur(46px)}
  .fog i{position:absolute;border-radius:50%;background:rgba(200,180,185,.22)}
  .fog i:nth-child(1){width:70vmax;height:34vmax;left:-25%;top:8%;animation:drift 22s ease-in-out infinite alternate}
  .fog i:nth-child(2){width:60vmax;height:30vmax;right:-30%;bottom:6%;animation:drift 28s ease-in-out infinite alternate-reverse}
  .fog i:nth-child(3){width:50vmax;height:24vmax;left:20%;top:40%;background:rgba(225,29,46,.16);animation:drift 18s ease-in-out infinite alternate}
  @keyframes drift{to{transform:translate(18vw,-4vh) scale(1.15)}}
  .g-nick{position:relative;font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,7.5vw,2.8rem);letter-spacing:-.02em;
    color:transparent;-webkit-text-stroke:1.2px var(--bone);filter:drop-shadow(0 0 16px rgba(225,29,46,.45))}
  .g-hint{position:relative;font-size:.8rem;color:rgba(243,236,232,.5);margin-top:-12px}
  .go{position:relative;z-index:1;font:800 1.05rem var(--text);letter-spacing:.06em;color:var(--bone);background:rgba(14,6,9,.62);
    border:0;border-radius:999px;padding:21px 54px;cursor:pointer;overflow:hidden;-webkit-tap-highlight-color:transparent;
    box-shadow:0 0 0 1px rgba(255,255,255,.1),0 0 44px rgba(225,29,46,.28),inset 0 0 22px rgba(225,29,46,.2);
    transition:box-shadow .3s,transform .3s}
  .go::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.6px;
    background:conic-gradient(from var(--a),transparent 0 52%,var(--blood) 80%,#ff8a78 92%,transparent 100%);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask-composite:exclude;animation:spin 3s linear infinite}
  .go::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--blood),transparent 75%);opacity:0;transition:opacity .35s}
  .go span{position:relative;z-index:1}
  .go:hover,.go:focus-visible{transform:scale(1.045);outline:none;box-shadow:0 0 0 1px rgba(255,255,255,.18),0 0 70px rgba(225,29,46,.6),inset 0 0 28px rgba(225,29,46,.45)}
  .go:hover::after,.go:focus-visible::after{opacity:.5}
  .go:active{transform:scale(.98)}
  @keyframes spin{to{--a:360deg}}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

  @media (max-width:720px){
    .bg::after{background:linear-gradient(0deg,rgba(10,5,7,.92) 0%,rgba(10,5,7,.55) 50%,rgba(10,5,7,.3) 100%)}
    .page{justify-content:flex-end;padding-bottom:max(48px,calc(env(safe-area-inset-bottom) + 32px))}
    .steam{align-self:stretch;justify-content:center}
  }
  @media (prefers-reduced-motion:reduce){h1,.go::before,.fog i{animation:none}.steam{transition:none}}
</style>
</head>
<body>

<div class="bg"><video id="v" autoplay muted loop playsinline preload="auto" poster="poster.jpg"><source src="bg.mp4" type="video/mp4"></video></div>

<button class="sound" id="sound" type="button" hidden>Звук включён</button>

<main class="page">
  <h1 aria-label="papochkadeneg"><span>papochka</span><span>deneg</span></h1>
  <p class="hours">хаххавхахвхахва</p>
  <a class="steam" href="https://steamcommunity.com/id/papochkadeneg" target="_blank" rel="noopener">
    Мой Steam
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>
  </a>
</main>

<div class="gate" id="gate">
  <div class="fog" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="g-nick">papochkadeneg</div>
  <button class="go" id="enter" type="button"><span>Продолжить</span></button>
</div>


<script>
  const v=document.getElementById("v"),gate=document.getElementById("gate"),btn=document.getElementById("sound");
  const sync=()=>btn.textContent=v.muted?"Включить звук":"Звук включён";
  v.play().catch(()=>{});                       // за экраном входа видео идёт без звука
  document.getElementById("enter").onclick=()=>{
    v.currentTime=0;v.muted=false;v.play().catch(()=>{});
    gate.classList.add("out");btn.hidden=false;sync();
    setTimeout(()=>gate.hidden=true,950);
  };
  btn.onclick=()=>{v.muted=!v.muted;v.play().catch(()=>{});sync();};
</script>
</body>
</html>
